[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp2-audio-tool-rl"
version = "0.1.0"
description = "Research code for tool-augmented audio-language model experiments and GRPO-style training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT for original repository code and documentation; third-party components retain their own terms" }
dependencies = [
    "numpy",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
